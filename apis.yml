aid: groupboss
name: Groupboss
description: >-
  Groupboss is a Facebook Group lead-generation and member-onboarding tool sold as
  a Chrome extension paired with a hosted web app. When someone requests to join a
  Facebook Group, Groupboss captures the answers to the group's membership
  questions — including the email address — approves or declines the member
  automatically against rules the admin sets, and pushes the captured lead into
  Google Sheets and into the admin's email marketing platform or CRM. It ships
  connectors for roughly thirty destinations including Mailchimp, ActiveCampaign,
  Klaviyo, Brevo, GetResponse, Kit, Drip, MailerLite, Omnisend, HubSpot, Zoho CRM,
  GoHighLevel, Airtable, FluentCRM, ClickFunnels and Systeme.io. Those connectors
  are one-directional and consume the customer's own API key for each destination
  platform; Groupboss itself publishes no public API, no webhooks and no developer
  program, so it is a pure API consumer rather than an API producer.
